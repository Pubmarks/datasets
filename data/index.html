<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pubmarks · Datasets</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1116;
        --panel: #151922;
        --border: #2a2e39;
        --text: #d1d4dc;
        --muted: #787b86;
        --accent: #2962ff;
        --pe: #f7931a;
      }
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.45;
      }
      header {
        flex-shrink: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }
      header p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
        flex: 1 1 200px;
      }
      label {
        font-size: 0.85rem;
        color: var(--muted);
      }
      select {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 0.95rem;
        min-width: 7rem;
      }
      a.data-link {
        color: var(--accent);
        font-size: 0.85rem;
        text-decoration: none;
      }
      a.data-link:hover {
        text-decoration: underline;
      }
      a.github-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        margin-left: auto;
        border-radius: 8px;
        color: var(--muted);
        border: 1px solid transparent;
        transition:
          color 0.15s ease,
          border-color 0.15s ease,
          background 0.15s ease;
      }
      a.github-link:hover {
        color: var(--text);
        border-color: var(--border);
        background: var(--bg);
      }
      a.github-link svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .layout {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: flex;
        align-items: stretch;
        gap: 12px;
        padding: 12px 16px;
      }
      .sidebar {
        flex: 0 0 300px;
        width: 300px;
        max-width: min(300px, 36vw);
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        -webkit-overflow-scrolling: touch;
      }
      .sidebar > h2 {
        margin: 0;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .charts-column {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .charts-stack {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      @media (max-width: 900px) {
        body {
          height: auto;
          min-height: 100dvh;
          overflow-x: hidden;
          overflow-y: auto;
        }
        .layout {
          flex-direction: column;
          flex: none;
          min-height: auto;
          overflow: visible;
        }
        .sidebar {
          flex: none;
          width: 100%;
          max-width: none;
          overflow: visible;
        }
        .charts-column {
          flex: none;
          min-height: 58vh;
        }
        .charts-stack {
          flex: 1 1 auto;
          min-height: 58vh;
        }
      }
      .pe-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
      }
      .pe-card-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 10px;
      }
      .pe-card-head h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }
      .pe-card-dates {
        font-size: 0.75rem;
        color: var(--muted);
        text-align: right;
      }
      .pe-versus {
        font-size: 0.9rem;
        margin-bottom: 12px;
      }
      .pe-versus strong {
        font-size: 1.35rem;
        font-weight: 600;
      }
      .pe-versus .tag {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .tag-high {
        background: rgba(239, 83, 80, 0.2);
        color: #ef9a9a;
      }
      .tag-low {
        background: rgba(38, 166, 154, 0.2);
        color: #80cbc4;
      }
      .tag-mid {
        background: rgba(120, 123, 134, 0.25);
        color: var(--muted);
      }
      .pe-range {
        position: relative;
        height: 40px;
        margin: 10px 0 8px;
        cursor: crosshair;
      }
      .pe-range-crosshair {
        position: absolute;
        top: 8px;
        width: 1px;
        height: 24px;
        background: rgba(209, 212, 220, 0.9);
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 4;
      }
      .pe-range-readout {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
        pointer-events: none;
        z-index: 5;
        white-space: nowrap;
      }
      .pe-range-track {
        position: absolute;
        left: 0;
        right: 0;
        top: 10px;
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          rgba(38, 166, 154, 0.35),
          rgba(247, 147, 26, 0.35),
          rgba(239, 83, 80, 0.35)
        );
      }
      .pe-marker {
        position: absolute;
        top: 4px;
        transform: translateX(-50%);
        width: 2px;
        height: 20px;
        border-radius: 1px;
        background: var(--muted);
        opacity: 0.9;
        z-index: 1;
        pointer-events: none;
      }
      .pe-marker.pe-current {
        width: 3px;
        height: 22px;
        top: 3px;
        background: var(--accent);
        opacity: 1;
        z-index: 3;
      }
      .pe-marker.pe-median {
        background: #f7931a;
      }
      .pe-marker.pe-mean {
        background: #ab47bc;
      }
      .pe-marker.pe-mode {
        background: #78909c;
      }
      .pe-marker.pe-harmonic {
        background: #29b6f6;
      }
      .pe-marker.pe-shiller {
        background: #ff7043;
      }
      .pe-range-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin: 0 0 12px;
        font-size: 0.65rem;
        color: var(--muted);
      }
      .pe-range-legend span::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: middle;
        background: var(--muted);
        opacity: 0.7;
      }
      .pe-range-legend .lg-median::before {
        background: #f7931a;
      }
      .pe-range-legend .lg-mean::before {
        background: #ab47bc;
      }
      .pe-range-legend .lg-harmonic::before {
        background: #29b6f6;
      }
      .pe-range-legend .lg-shiller::before {
        background: #ff7043;
      }
      .pe-range-legend .lg-now::before {
        background: var(--accent);
      }
      .pe-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
        font-size: 0.8rem;
      }
      .pe-stats dt {
        margin: 0;
        color: var(--muted);
      }
      .pe-stats dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .pe-card-empty {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .pe-card a.json-link {
        display: block;
        margin-top: 10px;
        font-size: 0.75rem;
        color: var(--accent);
        text-decoration: none;
      }
      .pe-card a.json-link:hover {
        text-decoration: underline;
      }
      .stats {
        flex-shrink: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 24px;
        font-size: 0.9rem;
      }
      .stats span {
        color: var(--muted);
      }
      .stats strong {
        color: var(--text);
        font-weight: 600;
      }
      .panel {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .panel-price {
        flex-grow: 1.65;
      }
      .panel-pe {
        flex-grow: 1;
      }
      .panel-title {
        flex-shrink: 0;
        padding: 10px 14px;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }
      #price-chart,
      #pe-chart {
        flex: 1 1 auto;
        width: 100%;
        min-height: 100px;
        height: 100%;
      }
      #status {
        flex-shrink: 0;
        padding: 4px 2px 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      #status.error {
        color: #ef5350;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pubmarks</h1>
      <label for="ticker">Ticker</label>
      <select id="ticker" aria-label="Stock ticker"></select>
      <a
        class="github-link"
        href="https://github.com/Pubmarks/datasets"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View source on GitHub"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
          />
        </svg>
      </a>
    </header>
    <main class="layout">
      <aside class="sidebar" aria-label="Average P/E statistics">
        <h2>Trailing avg P/E</h2>
        <div id="avgpe-panels">Loading…</div>
      </aside>
      <section class="charts-column">
        <div class="stats" id="stats" hidden></div>
        <div class="charts-stack">
          <div class="panel panel-price">
            <div class="panel-title">OHLCV · combined.csv</div>
            <div id="price-chart"></div>
          </div>
          <div class="panel panel-pe">
            <div class="panel-title">P/E ratio · combined.csv</div>
            <div id="pe-chart"></div>
          </div>
        </div>
        <div id="status">Loading tickers…</div>
      </section>
    </main>
    <script>
      const CDN_BASE = "https://pubmarks.github.io/datasets";

      const tickerEl = document.getElementById("ticker");
      const csvLink = document.getElementById("csv-link");
      const statsEl = document.getElementById("stats");
      const statusEl = document.getElementById("status");
      const priceRoot = document.getElementById("price-chart");
      const peRoot = document.getElementById("pe-chart");
      const avgpePanels = document.getElementById("avgpe-panels");

      let priceChart = null;
      let candleSeries = null;
      let peChart = null;
      let peSeries = null;
      let timeScalesLinked = false;
      let syncingTimeRange = false;

      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", Boolean(isError));
        statusEl.hidden = !message;
      }

      function combinedUrl(ticker) {
        return `${CDN_BASE}/stocks/${encodeURIComponent(ticker)}/combined.csv`;
      }

      function avgpeUrl(ticker, years) {
        return `${CDN_BASE}/stocks/${encodeURIComponent(ticker)}/avgpe_${years}.json`;
      }

      function fmtPe(value, digits = 1) {
        if (value == null || !Number.isFinite(value)) return "—";
        return value.toFixed(digits);
      }

      function pctVs(base, value) {
        if (!Number.isFinite(base) || base === 0 || !Number.isFinite(value)) {
          return null;
        }
        return ((value / base - 1) * 100);
      }

      function rangePct(value, min, max) {
        if (
          !Number.isFinite(value) ||
          !Number.isFinite(min) ||
          !Number.isFinite(max) ||
          max <= min
        ) {
          return 50;
        }
        return Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));
      }

      function versusTag(pct) {
        if (pct == null) {
          return `<span class="tag tag-mid">vs median</span>`;
        }
        const abs = Math.abs(pct);
        const label = `${pct >= 0 ? "+" : ""}${pct.toFixed(0)}% vs median`;
        if (abs < 5) return `<span class="tag tag-mid">${label}</span>`;
        if (pct > 0) return `<span class="tag tag-high">${label}</span>`;
        return `<span class="tag tag-low">${label}</span>`;
      }

      function bandExtents(data) {
        const vals = [
          data.p_e_min,
          data.p_e_max,
          data.p_e_last,
          data.p_e_mean,
          data.p_e_median,
          data.p_e_mode,
          data.p_e_harmonic,
          data.p_e_shiller,
        ].filter((v) => v != null && Number.isFinite(v));
        if (!vals.length) return { lo: 0, hi: 1 };
        return { lo: Math.min(...vals), hi: Math.max(...vals) };
      }

      function markerHtml(label, value, lo, hi, extraClass = "") {
        const left = rangePct(value, lo, hi);
        return `<div class="pe-marker ${extraClass}" style="left:${left}%" title="${label}: ${fmtPe(value)}" role="img" aria-label="${label}"></div>`;
      }

      function renderPeWindowCard(years, data, ticker) {
        const jsonHref = avgpeUrl(ticker, years);
        if (!data) {
          return `<div class="pe-card pe-card-empty">${years}-year stats unavailable.</div>`;
        }
        const min = data.p_e_min;
        const max = data.p_e_max;
        const cur = data.p_e_last;
        const med = data.p_e_median;
        const vsMed = pctVs(med, cur);
        const range =
          data.start_date && data.end_date
            ? `${data.start_date} → ${data.end_date}`
            : "";
        const { lo, hi } = bandExtents(data);

        const markerDefs = [
          { label: "min", value: min, class: "" },
          { label: "mean", value: data.p_e_mean, class: "pe-mean" },
          { label: "median", value: med, class: "pe-median" },
          { label: "mode", value: data.p_e_mode, class: "pe-mode" },
          { label: "harmonic", value: data.p_e_harmonic, class: "pe-harmonic" },
          { label: "Shiller", value: data.p_e_shiller, class: "pe-shiller" },
          { label: "now", value: cur, class: "pe-current" },
          { label: "max", value: max, class: "" },
        ].filter((m) => Number.isFinite(m.value));

        const markers = markerDefs
          .map((m) => markerHtml(m.label, m.value, lo, hi, m.class))
          .join("");

        return `
          <div class="pe-card">
            <div class="pe-card-head">
              <h3>${years} years</h3>
              <div class="pe-card-dates">${range}</div>
            </div>
            <div class="pe-versus">
              <strong>${fmtPe(cur)}</strong> current P/E
              ${versusTag(vsMed)}
            </div>
            <div class="pe-range" data-lo="${lo}" data-hi="${hi}">
              <div class="pe-range-readout" hidden>P/E —</div>
              <div class="pe-range-crosshair" hidden></div>
              <div class="pe-range-track"></div>
              ${markers}
            </div>
            <div class="pe-range-legend">
              <span class="lg-now">now</span>
              <span class="lg-median">median</span>
              <span class="lg-mean">mean</span>
              <span>mode</span>
              <span class="lg-harmonic">harmonic</span>
              <span class="lg-shiller">Shiller</span>
              <span>min / max</span>
            </div>
            <dl class="pe-stats">
              <dt>Current</dt><dd>${fmtPe(cur)} <span style="color:var(--muted)">${data.end_date ?? ""}</span></dd>
              <dt>Mean</dt><dd>${fmtPe(data.p_e_mean)}</dd>
              <dt>Median</dt><dd>${fmtPe(med)}</dd>
              <dt>Mode</dt><dd>${data.p_e_mode ?? "—"}</dd>
              <dt>Harmonic</dt><dd>${fmtPe(data.p_e_harmonic)}</dd>
              <dt>Shiller (CAPE)</dt><dd>${fmtPe(data.p_e_shiller)}</dd>
              <dt>Min (date)</dt><dd>${fmtPe(min)} <span style="color:var(--muted)">${data.p_e_min_date ?? ""}</span></dd>
              <dt>Max (date)</dt><dd>${fmtPe(max)} <span style="color:var(--muted)">${data.p_e_max_date ?? ""}</span></dd>
            </dl>
            <a class="json-link" href="${jsonHref}" target="_blank" rel="noopener">avgpe_${years}.json</a>
          </div>
        `;
      }

      async function fetchAvgpe(ticker, years) {
        const url = avgpeUrl(ticker, years);
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) return null;
        return res.json();
      }

      function wirePeRangeScrubbers(root) {
        root.querySelectorAll(".pe-range").forEach((el) => {
          const lo = Number(el.dataset.lo);
          const hi = Number(el.dataset.hi);
          const cross = el.querySelector(".pe-range-crosshair");
          const readout = el.querySelector(".pe-range-readout");
          if (
            !cross ||
            !readout ||
            !Number.isFinite(lo) ||
            !Number.isFinite(hi) ||
            hi <= lo
          ) {
            return;
          }

          const track = el.querySelector(".pe-range-track");

          const hide = () => {
            cross.hidden = true;
            readout.hidden = true;
          };

          const showAt = (clientX) => {
            const rect = track.getBoundingClientRect();
            if (rect.width <= 0) return;
            const x = Math.min(rect.right, Math.max(rect.left, clientX));
            const pct = (x - rect.left) / rect.width;
            const value = lo + pct * (hi - lo);
            const leftPct = pct * 100;
            cross.style.left = `${leftPct}%`;
            readout.style.left = `${leftPct}%`;
            readout.textContent = `P/E ${fmtPe(value, 2)}`;
            cross.hidden = false;
            readout.hidden = false;
          };

          el.addEventListener("mousemove", (e) => showAt(e.clientX));
          el.addEventListener("mouseleave", hide);
          el.addEventListener(
            "touchmove",
            (e) => {
              if (e.touches[0]) showAt(e.touches[0].clientX);
            },
            { passive: true }
          );
          el.addEventListener("touchend", hide);
        });
      }

      async function renderAvgpeSidebar(ticker) {
        avgpePanels.textContent = "Loading…";
        const [avg5, avg10] = await Promise.all([
          fetchAvgpe(ticker, 5),
          fetchAvgpe(ticker, 10),
        ]);
        avgpePanels.innerHTML =
          renderPeWindowCard(5, avg5, ticker) +
          renderPeWindowCard(10, avg10, ticker);
        wirePeRangeScrubbers(avgpePanels);
      }

      function optionalNum(raw) {
        if (raw === "" || raw === undefined) return null;
        const n = Number(raw);
        return Number.isFinite(n) ? n : null;
      }

      function parseCSV(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        const header = lines[0].split(",").map((h) => h.trim());
        const idx = (name) => header.indexOf(name);
        const dateIdx = idx("date");
        const openIdx = idx("open");
        const highIdx = idx("high");
        const lowIdx = idx("low");
        const closeIdx = idx("close");
        const peIdx = idx("pe_ratio");
        const epsIdx = idx("ttm_net_eps");
        if (dateIdx < 0 || closeIdx < 0) {
          throw new Error("combined.csv missing date or close column");
        }
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(",");
          const date = cols[dateIdx]?.trim();
          if (!date) continue;
          rows.push({
            date,
            open: openIdx >= 0 ? optionalNum(cols[openIdx]?.trim()) : null,
            high: highIdx >= 0 ? optionalNum(cols[highIdx]?.trim()) : null,
            low: lowIdx >= 0 ? optionalNum(cols[lowIdx]?.trim()) : null,
            close: optionalNum(cols[closeIdx]?.trim()),
            pe: peIdx >= 0 ? optionalNum(cols[peIdx]?.trim()) : null,
            eps: epsIdx >= 0 ? optionalNum(cols[epsIdx]?.trim()) : null,
          });
        }
        return rows;
      }

      function baseChartOptions() {
        return {
          layout: {
            background: { type: "solid", color: "#151922" },
            textColor: "#d1d4dc",
          },
          grid: {
            vertLines: { color: "#2a2e39" },
            horzLines: { color: "#2a2e39" },
          },
          rightPriceScale: { borderColor: "#2a2e39" },
          timeScale: { borderColor: "#2a2e39", timeVisible: true },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        };
      }

      function layoutCharts() {
        for (const [root, chart] of [
          [priceRoot, priceChart],
          [peRoot, peChart],
        ]) {
          if (!chart) continue;
          const { width, height } = root.getBoundingClientRect();
          if (width > 0 && height > 0) {
            chart.applyOptions({ width, height });
          }
        }
      }

      function observeResize(root, chart) {
        const ro = new ResizeObserver(() => layoutCharts());
        ro.observe(root);
        return ro;
      }

      window.addEventListener("resize", layoutCharts);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", layoutCharts);
      }

      function isValidTimeRange(range) {
        return Boolean(range && range.from != null && range.to != null);
      }

      function applyVisibleTimeRange(from, to) {
        const range = from.timeScale().getVisibleRange();
        if (!isValidTimeRange(range)) return false;
        try {
          syncingTimeRange = true;
          to.timeScale().setVisibleRange(range);
          return true;
        } catch (err) {
          console.warn("setVisibleRange", err);
          return false;
        } finally {
          syncingTimeRange = false;
        }
      }

      function linkTimeScales(a, b) {
        if (timeScalesLinked) return;
        const onRangeChange = (source, target) => {
          source.timeScale().subscribeVisibleTimeRangeChange((range) => {
            if (syncingTimeRange || !isValidTimeRange(range)) return;
            try {
              syncingTimeRange = true;
              target.timeScale().setVisibleRange(range);
            } catch (err) {
              console.warn("sync visible range", err);
            } finally {
              syncingTimeRange = false;
            }
          });
        };
        onRangeChange(a, b);
        onRangeChange(b, a);
        timeScalesLinked = true;
      }

      function fitAndSyncTimeScales() {
        priceChart.timeScale().fitContent();
        let attempts = 0;
        const trySync = () => {
          if (applyVisibleTimeRange(priceChart, peChart)) return;
          attempts += 1;
          if (attempts < 60) requestAnimationFrame(trySync);
        };
        requestAnimationFrame(trySync);
      }

      function ensureCharts() {
        if (!priceChart) {
          priceChart = LightweightCharts.createChart(priceRoot, {
            ...baseChartOptions(),
            rightPriceScale: {
              borderColor: "#2a2e39",
              mode: LightweightCharts.PriceScaleMode.Logarithmic,
            },
          });
          candleSeries = priceChart.addCandlestickSeries({
            upColor: "#26a69a",
            downColor: "#ef5350",
            borderVisible: false,
            wickUpColor: "#26a69a",
            wickDownColor: "#ef5350",
          });
          observeResize(priceRoot, priceChart);
        }
        if (!peChart) {
          peChart = LightweightCharts.createChart(peRoot, {
            ...baseChartOptions(),
            timeScale: { ...baseChartOptions().timeScale, timeVisible: false },
          });
          peSeries = peChart.addLineSeries({
            color: "#f7931a",
            lineWidth: 2,
            priceFormat: { type: "price", precision: 2, minMove: 0.01 },
          });
          observeResize(peRoot, peChart);
          linkTimeScales(priceChart, peChart);
        }
      }

      function renderCharts(rows) {
        ensureCharts();

        const candles = rows
          .filter(
            (r) =>
              r.open != null &&
              r.high != null &&
              r.low != null &&
              r.close != null
          )
          .map((r) => ({
            time: r.date,
            open: r.open,
            high: r.high,
            low: r.low,
            close: r.close,
          }));
        candleSeries.setData(candles);

        const pePoints = rows
          .filter((r) => r.pe != null)
          .map((r) => ({ time: r.date, value: r.pe }));
        peSeries.setData(pePoints);

        fitAndSyncTimeScales();

        const withPe = rows.filter((r) => r.pe != null);
        const lastPe = withPe.length ? withPe[withPe.length - 1] : null;
        const lastBar = rows.length ? rows[rows.length - 1] : null;
        const summary = lastPe || lastBar;
        if (summary) {
          statsEl.hidden = false;
          const peFmt =
            lastPe?.pe != null ? lastPe.pe.toFixed(2) : "—";
          const epsPart =
            summary.eps != null
              ? `<span>TTM EPS</span> <strong>${summary.eps.toFixed(2)}</strong>`
              : "";
          const closePart =
            summary.close != null
              ? `<span>Close</span> <strong>${summary.close.toFixed(2)}</strong>`
              : "";
          statsEl.innerHTML = `
            <span>As of</span> <strong>${summary.date}</strong>
            <span>P/E</span> <strong>${peFmt}</strong>
            ${epsPart}
            ${closePart}
            <span>Bars</span> <strong>${candles.length.toLocaleString()}</strong>
            <span>P/E points</span> <strong>${pePoints.length.toLocaleString()}</strong>
          `;
        } else {
          statsEl.hidden = true;
        }
        requestAnimationFrame(layoutCharts);
      }

      async function loadCombined(ticker) {
        const url = combinedUrl(ticker);
        if (csvLink) {
          csvLink.href = url;
          csvLink.textContent = url.replace(`${CDN_BASE}/`, "");
        }
        setStatus(`Loading ${url}…`, false);

        const sidebarPromise = renderAvgpeSidebar(ticker).catch((err) => {
          avgpePanels.innerHTML = `<div class="pe-card pe-card-empty">${err.message}</div>`;
        });

        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status} for ${url}`);
        }
        const rows = parseCSV(await res.text());
        if (!rows.length) {
          throw new Error("No rows in combined.csv");
        }
        renderCharts(rows);
        await sidebarPromise;
        setStatus("", false);
      }

      function tickerFromQuery() {
        const p = new URLSearchParams(location.search).get("t");
        return p ? p.toUpperCase() : null;
      }

      function syncQuery(ticker) {
        const u = new URL(location.href);
        u.searchParams.set("t", ticker);
        history.replaceState(null, "", u);
      }

      async function init() {
        const url = `${CDN_BASE}/stocks/tickers.json`;
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) {
          throw new Error(`Could not load ${url}`);
        }
        const { tickers } = await res.json();
        if (!Array.isArray(tickers) || !tickers.length) {
          throw new Error(`${url} has no tickers`);
        }
        tickerEl.replaceChildren(
          ...tickers.map((t) => {
            const o = document.createElement("option");
            o.value = t;
            o.textContent = t;
            return o;
          })
        );
        const initial = tickerFromQuery();
        if (initial && tickers.includes(initial)) {
          tickerEl.value = initial;
        }
        await loadCombined(tickerEl.value);
      }

      tickerEl.addEventListener("change", async () => {
        const t = tickerEl.value;
        syncQuery(t);
        try {
          await loadCombined(t);
        } catch (e) {
          setStatus(e.message, true);
        }
      });

      init().catch((e) => setStatus(e.message, true));
    </script>
  </body>
</html>
