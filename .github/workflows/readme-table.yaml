name: Update README table

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Update README stocks table
        run: uv run scripts/python/readme/stocks_table.py

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/stocks/tickers.json
          git diff --staged --quiet || (
            git commit -m "chore: update readme table" &&
            branch="$(git branch --show-current)" &&
            git pull --rebase origin "$branch" &&
            git push
          )

      - name: Start Datasets GitHub Pages
        if: success()
        run: gh workflow run datasets-github-pages.yaml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
